databaseChangeLog:
  - changeSet:
      id: 0001-create-tax-document-metadata
      author: giovannibaratta
      changes:
        - createTable:
            tableName: tax_document_metadata
            columns:
              - column:
                  name: id
                  type: INTEGER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: document_sha
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: jurisdiction
                  type: VARCHAR(50)
                  constraints:
                    nullable: true
              - column:
                  name: page_number
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: text_content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: chunk_index
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
