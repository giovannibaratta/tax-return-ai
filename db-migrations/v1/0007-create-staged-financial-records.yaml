databaseChangeLog:
  - changeSet:
      id: 0007-create-staged-financial-records
      author: giovannibaratta
      changes:
        - createTable:
            tableName: staged_financial_records
            columns:
              - column:
                  name: id
                  type: INTEGER
                  constraints:
                    primaryKey: true
                    nullable: false
                    autoIncrement: true
              - column:
                  name: provider
                  type: VARCHAR(255)
              - column:
                  name: source_file_name
                  type: VARCHAR(255)
              - column:
                  name: source_file_sha
                  type: VARCHAR(64)
              - column:
                  name: event_timestamp
                  type: TIMESTAMP
              - column:
                  name: ingestion_timestamp
                  type: TIMESTAMP
              - column:
                  name: asset_type
                  type: VARCHAR(100)
              - column:
                  name: symbol
                  type: VARCHAR(50)
              - column:
                  name: isin
                  type: VARCHAR(12)
              - column:
                  name: asset_name
                  type: VARCHAR(255)
              - column:
                  name: action
                  type: VARCHAR(50)
              - column:
                  name: quantity
                  type: DECIMAL
              - column:
                  name: unit_price
                  type: DECIMAL
              - column:
                  name: currency
                  type: VARCHAR(10)
                  # TODO: Should we remove the default to avoid crafting data ?
                  defaultValue: EUR
              - column:
                  name: fees
                  type: DECIMAL
              - column:
                  name: total_amount
                  type: DECIMAL
              - column:
                  name: fx_rate
                  type: DECIMAL
              - column:
                  name: local_total_amount
                  type: DECIMAL
              - column:
                  name: tax_year
                  type: INTEGER
              - column:
                  name: jurisdiction
                  type: VARCHAR(50)
              - column:
                  name: additional_metadata
                  type: TEXT
              - column:
                  name: verification_status
                  type: VARCHAR(50)
                  defaultValue: pending_approval
              - column:
                  name: consensus_log
                  type: TEXT
