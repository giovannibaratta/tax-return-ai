databaseChangeLog:
  - changeSet:
      id: 0016-create-staged-tax-income-records
      author: antigravity
      changes:
        - createTable:
            tableName: staged_tax_income_records
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tax_year
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: jurisdiction
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: income_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: source_document_sha
                  type: varchar(64)
                  constraints:
                    nullable: true
              - column:
                  name: source_file_name
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: payload_json
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: voter_outputs_json
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: discrepancies_json
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: verification_status
                  type: varchar(32)
                  defaultValue: "pending_approval"
                  constraints:
                    nullable: false
              - column:
                  name: approved_tax_income_record_id
                  type: integer
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_staged_tax_income_records_year_jurisdiction
            tableName: staged_tax_income_records
            columns:
              - column:
                  name: tax_year
              - column:
                  name: jurisdiction
